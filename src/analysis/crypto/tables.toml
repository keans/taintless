# Built-in tables of the `taintless crypto` command. A `.taintless.toml` can add entries
# of the same shape under `[crypto]` (see docs/guide.md); its entries are matched first.
#
# library    an imported module (prefix, `.`, `/` or `::` separated) -> the library it belongs to
# call       a call pattern (`name`, `a.b`, `*.method`, `PREFIX_*`) -> primitive and algorithm;
#            `weak` marks a broken algorithm, `library` makes it count only when that library is imported
# dependency a name in a manifest that differs from the module it provides (`*` suffix: prefix)
# secret     arguments (0-based) of a call that hold a key, iv, salt or secret
# algorithm  arguments (`index`, and/or `keywords`) that name the algorithm: untrusted data there is a taint finding
# limit      numeric arguments with a recommended minimum
# prng       non-cryptographic random generators; `with_import` / `without_import` are modules
#
# Languages: python, javascript (also TypeScript), rust, go, java, c (also C++), csharp.

