[package]
name = "taintless"
version = "0.1.0"
edition = "2024"
description = "Static taint, control-flow, call-graph and dependency analysis for thirteen languages, built on tree-sitter"
license = "MIT"
readme = "README.md"
keywords = ["static-analysis", "taint-analysis", "security", "tree-sitter", "call-graph"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
indicatif = { version = "0.18.6", features = ["rayon"] }
petgraph = { version = "0.8.3", features = ["serde-1"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
insta = "1.48.0"

[build-dependencies]
blake3 = "1.8.7"
