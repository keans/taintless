[package]
name = "taintless"
version = "0.1.0"
edition = "2024"
description = "Static taint, control-flow, call-graph and dependency analysis for eight languages, built on tree-sitter"
license = "MIT"
readme = "README.md"
keywords = ["static-analysis", "taint-analysis", "security", "tree-sitter", "call-graph"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
indicatif = { version = "0.18.6", features = ["rayon"] }
petgraph = "0.8.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
insta = "1.48.0"
