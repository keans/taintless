name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/check_markdown_width.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Lower every function of real open-source projects; any parse error or
  # panic fails the job (see tests/smoke.rs).
  corpora:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository:
          - psf/requests
          - expressjs/express
          - google/gson
          - gin-gonic/gin
          - DaveGamble/cJSON
          - fmtlib/fmt
          - BurntSushi/ripgrep
          - microsoft/TypeScriptSamples
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch corpus
        env:
          CORPUS_REPOSITORY: ${{ matrix.repository }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git clone --depth 1 "https://github.com/$CORPUS_REPOSITORY" "$RUNNER_TEMP/corpus"
      - name: Smoke test
        env:
          TAINTLESS_CORPUS: ${{ runner.temp }}/corpus
        run: |
          cargo test --locked --release --test smoke scans_external_corpora -- --exact --nocapture
